name: Update InfoHub Page

on:
  workflow_dispatch:
  push:
    paths:
      - "images/arm64/nxp/frdm_imx93/Secure_Boot_Architecture_EmbeddedPUML.adoc"

jobs:
  update-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: security

      # ✅ Install tools
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq pandoc

      # ✅ Convert AsciiDoc → DocBook XML
      - name: Convert AsciiDoc
        run: |
          asciidoctor -b docbook -s -a showtitle images/arm64/nxp/frdm_imx93/Secure_Boot_Architecture_EmbeddedPUML.adoc -o fragment.xml
          
      # ✅ Extract compliant HTML body content using Pandoc
      - name: Prepare HTML fragment
        run: |
          pandoc -f docbook -t html fragment.xml -o fragment.html

      # ✅ Get current page version from Confluence API
      - name: Get current version
        id: version
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.CONFLUENCE_API_TOKEN }}" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${{ secrets.CONFLUENCE_PAGE_ID }}?expand=version")

          VERSION=$(echo "$RESPONSE" | jq '.version.number')
          echo "current=$VERSION" >> $GITHUB_OUTPUT

           # ✅ Build final payload using safe jq injection arguments and trigger API
      - name: Update Confluence page
        run: |
          # Calculate the next version integer cleanly in Bash
          NEXT_VERSION=$(expr ${{ steps.version.outputs.current }} + 1)
          
          # Removed the "space" block entirely to avoid space mutation errors
          jq -n \
            --arg html "$(cat fragment.html)" \
            --argjson v "$NEXT_VERSION" \
            '{
              "id": "${{ secrets.CONFLUENCE_PAGE_ID }}",
              "type": "page",
              "title": "Secure Boot & Storage Architecture on EB Corbos Linux I.MX93 (FRDM)",
              "body": {
                "storage": {
                  "value": $html,
                  "representation": "storage"
                }
              },
              "version": {
                "number": $v
              }
            }' > final_payload.json

          # Send update to endpoint via PUT file mapping
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @final_payload.json \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${{ secrets.CONFLUENCE_PAGE_ID }}?expand=version"
