name: Update InfoHub Page

on:
  workflow_dispatch:
  push:
    paths:
      - "images/arm64/nxp/frdm_imx93/Secure_Boot_Architecture_EmbeddedPUML.adoc"

jobs:
  update-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: security

      # ✅ Install tools
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq

      # ✅ Convert AsciiDoc → HTML
      - name: Convert AsciiDoc
        run: |
          asciidoctor \
            -b html5 \
            -o output.html \
            images/arm64/nxp/frdm_imx93/Secure_Boot_Architecture_EmbeddedPUML.adoc

      # ✅ Escape content for JSON
      - name: Prepare content
        id: content
        run: |
          CONTENT=$(jq -Rs '.' output.html)
          echo "content=$CONTENT" >> $GITHUB_OUTPUT

      # ✅ Get current page version
      - name: Get current version
        id: version
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.CONFLUENCE_API_TOKEN }}" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${{ secrets.CONFLUENCE_PAGE_ID }}?expand=version")

          VERSION=$(echo "$RESPONSE" | jq '.version.number')
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      # ✅ Debug
      - name: Debug output
        run: |
          echo "===== OUTPUT HTML ====="
          head -n 50 output.html

      # ✅ Update page
      - name: Update Confluence page
        run: |
          NEW_VERSION=$(expr ${{ steps.version.outputs.current }} + 1)
      
          # Create JSON payload safely
          cat > payload.json <<EOF
          {
            "id": "${{ secrets.CONFLUENCE_PAGE_ID }}",
            "type": "page",
            "title": "Secure Boot Architecture",
            "version": { "number": $NEW_VERSION },
            "body": {
              "storage": {
                "value": ${{ steps.content.outputs.content }},
                "representation": "storage"
              }
            }
          }
          EOF
          # Call API using file
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${{ secrets.CONFLUENCE_PAGE_ID }}"
